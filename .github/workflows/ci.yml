name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # The dev toolchain (vitest, tsup) needs Node 22+, so the test suite runs
                # from 22 up. The Node 20 runtime floor in `engines` is covered by the
                # runtime-floor job below.
                node-version: [22, 24]
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm run test:coverage

            - run: pnpm run build

            # verify:dist reads the built dist/ and is the gate that caught the
            # internal-symbol leak (ADR-007) while src sat at 100% coverage. Runs
            # after build, on every Node so a Node-specific build regression fails here.
            - run: pnpm run verify:dist

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-node-${{ matrix.node-version }}
                  path: coverage/

    runtime-floor:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            # Build with a toolchain-supported Node, then run the shipped dist/ on the
            # oldest Node in `engines` (20). The library has no runtime dependencies, so
            # verify-dist exercising dist/ is what proves Node 20 still works.
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm run build

            - uses: actions/setup-node@v6
              with:
                  node-version: 20

            - run: node --version && node scripts/verify-dist.mjs

    static:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            # Static checks (format, lint, type) are Node-independent — run once on a
            # modern Node rather than across the runtime matrix above.
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm run format:check

            - run: pnpm run lint

            - run: pnpm run typecheck

            - run: pnpm run typecheck:test-types
